name: Test

# Reusable workflow: typecheck + unit + integration tests, plus the
# GreenMail fixture the integration suite talks to. Called by both
# ci.yml (every push to main / every PR) and release.yml (as the gate
# that must pass before an image is pushed to GHCR in the same run).
on:
  workflow_call:

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned explicitly rather than relying on the package.json
          # floor (">=20"): the test runner's own glob expansion of
          # test/unit/*.test.ts and test/integration/*.test.ts needs a
          # known-good Node version, not "whatever satisfies >=20".
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # tsconfig.json's `include` is ["src/**/*"], so the step above compiles
      # nothing under test/ — and the suites run through tsx, which strips
      # types without checking them. Without this second step the ~1,400 lines
      # of TypeScript in test/ would never be typechecked anywhere.
      - name: Type check tests
        run: npm run typecheck:test

      - name: Unit tests
        run: npm run test:unit

      # GreenMail is started via the repo's own docker-compose.test.yml
      # (owned by the test-suite task) rather than redeclared here as a
      # GitHub Actions service container. That keeps hostnames, ports,
      # the mandatory -Dgreenmail.hostname=0.0.0.0 flag and the fixture
      # users in one file that the integration tests are actually
      # written against, instead of a second, easily-drifting copy of
      # the same config living in this workflow.
      - name: Start GreenMail fixture
        run: docker compose -f docker-compose.test.yml up -d

      # Deliberately no "wait for GreenMail" step here. No line GreenMail
      # logs is a reliable readiness signal (this image never prints a
      # "Started" banner, and its "Starting ..." lines print before the
      # listeners actually accept connections), so readiness is owned
      # entirely by the integration suite itself: test/helpers/docker.ts
      # polls the IMAP/SMTP ports for a real protocol handshake, and
      # test/helpers/imap-setup.ts retries the IMAP login on top of that
      # to absorb the fixture users registering slightly later still. Do
      # not re-add a log-scraping or fixed-sleep wait loop here — it can
      # only duplicate that logic and drift from it.

      - name: Integration tests
        run: npm run test:integration

      - name: Stop GreenMail fixture
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
