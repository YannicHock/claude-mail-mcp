name: CI

# Pull requests and pushes to main.
#
# This workflow owns main outright. It runs the suite, checks the tree agrees with
# itself about its version, and — on main only — publishes both images tagged with
# the commit sha and nothing else.
#
# No `latest` and no version tag are published here. Those belong to a release, which
# release.yml owns and a v* tag triggers. Between two releases the way to run main is
# `sha-<short>`: it names exactly one commit and can never move.
#
# Until 2026-09-08 release.yml also triggered on main, so every push ran the whole
# suite twice — once here, once there — and built both images three times over.
# It no longer triggers on a branch at all.

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. The publishing job widens its own and nothing else does.
permissions:
  contents: read

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap, and it catches the failure that is most expensive to notice late: a
      # tree whose eight version strings disagree. 0.3.0 and 0.4.0 both reached main
      # while package.json read 0.2.1 and /health reported 0.2.1 to every caller.
      - name: Check that every version string agrees
        run: scripts/check-versions.sh

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  image:
    name: Image — ${{ matrix.component }}
    needs: [test, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used on main; a pull request never reaches the publishing steps, and a
      # fork's token would not carry these anyway.
      packages: write
      id-token: write
      attestations: write
    strategy:
      # One image failing to build should not hide whether the other one does.
      fail-fast: false
      matrix:
        include:
          # Image names are hardcoded lowercase rather than derived from
          # github.repository ("YannicHock/claude-mail-mcp"): GHCR rejects uppercase
          # in image references. They cannot come from workflow-level `env` either,
          # which is not in scope while a matrix is evaluated.
          - component: connector
            image: ghcr.io/yannichock/claude-mail-mcp
            context: .
            file: Dockerfile
            cache_scope: connector
          # The OAuth layer builds from the repository root as well, because it
          # compiles shared/ and a context rooted at oauth/ cannot reach a sibling
          # directory (#126). What keeps the connector's tree out of it is
          # oauth/Dockerfile.dockerignore, which BuildKit resolves in preference to
          # the root .dockerignore — so a stray `import "../src/..."` from oauth/src
          # still fails here rather than in production.
          - component: oauth
            image: ghcr.io/yannichock/claude-mail-mcp-oauth
            context: .
            file: oauth/Dockerfile
            cache_scope: oauth
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # `latest=false` is not optional. The default flavor adds `latest`
          # whenever any rule matches, which is the opposite of what this workflow
          # is for: main must never claim to be the released version.
          flavor: |
            latest=false
          tags: |
            type=sha

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # A pull request builds amd64 only. arm64 there runs under QEMU emulation
          # and costs several minutes to prove something the release build proves
          # properly; what a PR needs to know is whether the Dockerfile is still
          # sound.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance comes from actions/attest-build-provenance below instead of
          # from buildx. Buildx writes its attestations as extra entries in the
          # manifest index, where they surface in registry UIs as an
          # `unknown/unknown` platform; the attestation action leaves the index
          # alone and produces something `gh attestation verify` can check.
          provenance: false
          sbom: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
