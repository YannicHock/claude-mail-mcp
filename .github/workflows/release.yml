name: Release

# Version tags only. Pushing `v0.5.0` runs the suite, checks the tree really is
# 0.5.0 everywhere, publishes both images as `0.5.0`, `latest` and `sha-<short>`,
# and creates the GitHub release from the matching CHANGELOG section.
#
# Branches are not a trigger. main is ci.yml's, which publishes `sha-<short>` and
# nothing that moves.
#
# Two tag patterns were deliberately dropped on 2026-09-08: `{{major}}.{{minor}}`
# and `{{major}}`. They came from docker/metadata-action's example config, which
# encodes the convention of the official base images — where independent consumers
# want to track a minor line and receive patches without editing anything. Nothing
# in this repository refers to them; docker-compose.yml, the README and
# docs/DEPLOYMENT.md all use `latest`. And for a 0.x project `0` claims a
# compatibility line that SemVer explicitly withholds: "Major version zero is for
# initial development. Anything MAY change at any time." Moving tags are also the
# only tags an older release can overwrite, which is not theoretical — pushing
# v0.3.0 and v0.4.0 together once left `0` pointing wherever the race landed.
#
# One property this arrangement keeps: pushing an old tag moves `latest` back onto
# it. That is a deliberate act with a visible cause, unlike the race above, and the
# remedy is to push the newer tag again.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Per-ref, so two tags pushed together do not serialise into one another, and
# cancel-in-progress stays false so a half-finished registry push is never
# interrupted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # With the tag as the expected value, so a tag that names a version the tree
      # does not carry fails here — in seconds, before anything is built, and long
      # before an image claiming that version reaches the registry. Also refuses a
      # release with no CHANGELOG section, because that section is the release body.
      - name: Check the tree matches the tag
        run: scripts/check-versions.sh "${GITHUB_REF_NAME}"

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  publish:
    name: Publish — ${{ matrix.component }}
    needs: [test, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tagged in lockstep, from the same commit and the same workflow run. The
          # two are deployed together and a version skew between them is not
          # something this repository intends to support — scripts/check-versions.sh
          # is what enforces that rather than leaves it to habit.
          - component: connector
            image: ghcr.io/yannichock/claude-mail-mcp
            context: .
            file: Dockerfile
            cache_scope: connector
          - component: oauth
            image: ghcr.io/yannichock/claude-mail-mcp-oauth
            context: oauth
            file: oauth/Dockerfile
            cache_scope: oauth
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.image }}
          # `latest` is set by the explicit rule below and by nothing else. The
          # default flavor would add it on its own whenever a semver rule matched.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See ci.yml for why provenance comes from the attestation action rather
          # than from buildx.
          provenance: false
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    # Only after both images are in the registry: a release that points at artefacts
    # which do not exist is worse than a release that appears a minute later.
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { capturing = 1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "CHANGELOG.md has no body under '## [${version}]'." >&2
            exit 1
          fi

      # `gh` is preinstalled on the runner, so the release is cut without a
      # third-party action — one less thing in the supply chain for a step whose
      # whole job is two API calls.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag
