name: Release

# Runs on every push to main and on version tags (v*). Tests run first
# via the shared _test.yml workflow, in this same run; the build/push
# job is gated on that via `needs`, so a failing test suite blocks the
# publish to GHCR.
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: ghcr.io/yannichock/claude-mail-mcp

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  release:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is hardcoded lowercase above rather than derived from
      # github.repository (which is "YannicHock/claude-mail-mcp"): GHCR
      # rejects uppercase in image references.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
