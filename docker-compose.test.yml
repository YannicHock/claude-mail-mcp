services:
  # GreenMail — disposable IMAP/SMTP server for the integration suite
  # (test/integration/*.test.ts). Not part of the application's own
  # deployment (see docker-compose.yml); this file exists only to give
  # `npm run test:integration` something real to talk to.
  #
  # Verified invocation — see .superpowers/sdd/plan-dockerize-ci-tests/
  # greenmail-findings.md for how these settings were derived:
  #   - `-Dgreenmail.hostname=0.0.0.0` is mandatory: GreenMail defaults to
  #     binding 127.0.0.1 *inside the container*, which is unreachable
  #     through Docker's published ports.
  #   - No TLS is configured or needed: port 3143 advertises no STARTTLS
  #     capability, so the test accounts connect with tls:false and there
  #     is no self-signed certificate in the path to reject or trust.
  #     NODE_TLS_REJECT_UNAUTHORIZED is never set anywhere in this repo.
  #   - `-Dgreenmail.setup.test.all` creates the standard "test" port set
  #     (offset by +3000 from the protocol default: SMTP 3025, IMAP 3143,
  #     IMAPS 3993, ...).
  #   - `-Dgreenmail.users=...` pre-creates the two mailboxes the
  #     integration tests log into. Log in with the local part (`alice`),
  #     not the full address.
  greenmail:
    # Pinned to an exact digest, not `:latest`: this fixture gates every CI
    # run, and an upstream release could otherwise break the pipeline on a day
    # nobody touched the repository. The tag is carried alongside the digest
    # for readability only — the digest is what Docker resolves.
    # Bump deliberately; verify the integration suite still passes.
    image: greenmail/standalone:2.1.13@sha256:3df66b7edd01c8a301343ca5e3601d8674760d4708655573560c24745e624fb2
    ports:
      - "3143:3143" # IMAP (plain — used by the tests)
      - "3993:3993" # IMAPS (unused: no STARTTLS on 3143 means there's no
      #                TLS path to test here; exposed for parity with the
      #                task brief and in case a future test wants it)
      - "3025:3025" # SMTP (plain — used by the tests)
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:pw1@example.com,bob:pw2@example.com
