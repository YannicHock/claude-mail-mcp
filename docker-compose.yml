services:
  mail-mcp:
    image: ghcr.io/yannichock/claude-mail-mcp:latest
    # PID 1 inside the container is a tiny init (tini, bundled with the
    # Docker Engine) that reaps zombies and forwards signals — required so
    # SIGTERM reaches node and triggers the graceful shutdown in src/index.ts.
    init: true
    restart: unless-stopped
    # WARNING — loopback only. The image binds 0.0.0.0 *inside* the
    # container (required for Docker's port publishing to work at all),
    # so this host_ip is the only thing standing between the unauthenticated
    # GET /health endpoint (leaks server name, version, account count,
    # accounts_file path) and the public internet on a host like Hetzner.
    # nginx terminates TLS in front of this — see docs/DEPLOYMENT.md.
    # Never change this to "3220:3220" or "0.0.0.0:3220:3220".
    ports:
      - "127.0.0.1:3220:3220"
    env_file:
      # AUTH_TOKEN, PUBLIC_URL, LOG_LEVEL, SECRETS_GID — copy from
      # .env.docker.example. Never commit the resulting .env.
      - .env
    # The host group that owns ./secrets/shared, added as a supplementary group
    # so this container can read and create files there. SECRETS_GID is a real
    # gid on *your* host, from `groupadd --system mailsecrets` — see the secrets/
    # note at the bottom of this file. Compose reads it from ./.env; leave it
    # unset and the stack refuses to start rather than silently running without
    # it.
    group_add:
      - "${SECRETS_GID:?set SECRETS_GID in .env to the gid of the group that owns ./secrets/shared and ./secrets/oauth — see docs/DEPLOYMENT.md step 2}"
    environment:
      # Fixed container-side path; the actual credentials file is supplied
      # via the bind mount below and never baked into image or repo.
      ACCOUNTS_FILE: /data/accounts.json
      # Both of these are read from ./secrets/shared if the file is there and
      # generated into it if it is not — see the secrets/ comment at the bottom
      # of this file. AUTH_TOKEN in .env still wins over an absent file, so an
      # existing install keeps the token its Claude clients are already using.
      #
      # These two paths are the whole of this service's interest in secrets/,
      # and the mount below now hands it exactly them and nothing else.
      AUTH_TOKEN_FILE: /secrets/shared/auth_token.txt
      SETTINGS_SIGNING_KEY_FILE: /secrets/shared/settings_signing_key.txt
    volumes:
      # accounts.json — every mailbox credential — and nothing else. Writable
      # since the settings UI: the connector is the only process that writes
      # accounts.json, and it is the one that already reads the credentials in
      # it. The *directory* must be writable by uid 100 too, not just the file —
      # saving renames a temp file into place. See
      # docs/planning/specs/2026-09-08-settings-ui.md §10.
      #
      # A named volume rather than ./data, and that is the whole of #105: Docker
      # creates a missing bind-mount source itself, as root:root mode 755, and
      # uid 100 cannot write in it. A named volume it initialises from the image
      # instead, where /data is already the runtime user's — so ownership comes
      # out right with no operator step and no uid in any instruction. Look
      # inside it with `docker compose exec mail-mcp ls -ln /data`; back it up
      # and migrate an existing ./data into it per docs/DEPLOYMENT.md step 3.
      - mail-data:/data
      # Only the shared half of secrets/, because only the shared half is named
      # in this service's environment above. ./secrets/oauth — the OAuth signing
      # key and the operator's password hash — is mounted into mail-oauth alone
      # and is not reachable from this container at all: this process parses
      # MIME that arrives from the public internet, and neither of those two
      # secrets is anywhere near its job.
      #
      # Writable, not `:ro`: this service usually boots first (mail-oauth
      # `depends_on` it) and is therefore the one that generates both shared
      # secrets on a first boot, and replacing a file somebody truncated to
      # nothing means unlinking it first. Read-only here is correct only if you
      # pre-create both files yourself — see the note at the bottom of this file.
      - ./secrets/shared:/secrets/shared
    # Healthcheck is inherited from the image's HEALTHCHECK instruction
    # (GET /health via a plain node http request — Alpine has no curl).

  # ---------------------------------------------------------------------
  # OAuth 2.1 layer. Only needed for claude.ai web and Cowork, which cannot
  # send a custom Authorization header and require OAuth discovery instead.
  # Claude Desktop talks to mail-mcp directly with the static AUTH_TOKEN and
  # needs none of this — see docs/DEPLOYMENT.md, "Option A".
  #
  # Comment this service out if you only use Option A.
  # ---------------------------------------------------------------------
  mail-oauth:
    image: ghcr.io/yannichock/claude-mail-mcp-oauth:latest
    init: true
    restart: unless-stopped
    depends_on:
      - mail-mcp
    # WARNING — loopback only, for the same reason as mail-mcp above. If your
    # TLS terminator runs in a container rather than on the host (Nginx Proxy
    # Manager, Traefik, Caddy in Docker), it cannot reach the host's 127.0.0.1:
    # drop this `ports` block entirely and put both services on the proxy's
    # network instead. docs/DEPLOYMENT.md documents that variant, which
    # publishes nothing to the host at all and is the tighter arrangement.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Service name resolution on the compose network; mail-mcp is never
      # reachable from outside it.
      UPSTREAM_MCP_URL: http://mail-mcp:3220
      # /secrets/shared holds the two files the connector mounts as well — that
      # is the point of them. /secrets/oauth holds the two that are this
      # service's business alone, and the connector never sees that directory.
      # All three random secrets are generated on the first boot that finds them
      # absent; the password hash is set by the setup wizard.
      UPSTREAM_AUTH_TOKEN_FILE: /secrets/shared/auth_token.txt
      SETTINGS_SIGNING_KEY_FILE: /secrets/shared/settings_signing_key.txt
      SIGNING_KEY_FILE: /secrets/oauth/oauth_signing_key.txt
      AUTH_PASSWORD_HASH_FILE: /secrets/oauth/auth_password_hash.txt
      STATE_FILE: /data/oauth-state.json
    env_file:
      # PUBLIC_URL, AUTH_USERNAME, LOG_LEVEL — copy from oauth/.env.example.
      # Secrets belong in secrets/ below, not here: values set through env_file
      # are visible in `docker inspect` and to anything that can read the
      # container's environment.
      - .env.oauth
    # Same host group as mail-mcp above — that is the whole point of it: one
    # group both containers are in, so each can read a secret the other wrote in
    # ./secrets/shared. ./secrets/oauth is owned by the same group for the same
    # practical reason (this container has to create files there), but what keeps
    # the connector out of it is the mount, not the group.
    # The value comes from ./.env even though this service's env_file is
    # .env.oauth: Compose interpolates `${...}` from the project's .env only, and
    # a variable read from an env_file is never available for interpolation.
    group_add:
      - "${SECRETS_GID:?set SECRETS_GID in .env to the gid of the group that owns ./secrets/shared and ./secrets/oauth — see docs/DEPLOYMENT.md step 2}"
    volumes:
      # Registered clients and live refresh sessions, the live operator record,
      # and — until setup finishes — the claim token. Losing it logs every Claude
      # client out and forces re-registration.
      #
      # A named volume, for the reason the connector's carries: this is the
      # directory an unclaimed instance must write its claim token to before it
      # can print a setup URL at all, and a root:root bind-mount source Docker
      # made on the way past turned the first boot of a clean clone into a crash
      # loop with no URL in it (#105).
      - oauth-data:/data
      # Both halves, and both writable: this service generates whichever of the
      # three random secrets is missing, and #79's blank-file replacement
      # unlinks before it rewrites.
      - ./secrets/shared:/secrets/shared
      - ./secrets/oauth:/secrets/oauth
    # Healthcheck is inherited from the image's HEALTHCHECK instruction.

# ---------------------------------------------------------------------------
# The two data volumes. Docker manages them; there is nothing to create before
# the first `docker compose up` and nothing to chown.
#
# That is the point of them. Both images pre-create /data owned by their own
# runtime user (uid 100 for the connector, uid 102 for the OAuth layer — see the
# `RUN mkdir -p /data && chown …` line in each Dockerfile), and Docker
# initialises an empty named volume from the image's directory, ownership
# included. A bind mount gets none of that: Docker creates a missing source as
# root:root 755, both services then fail to write, and the OAuth layer's failure
# lands on the one boot the operator is watching for their setup URL.
#
# Compose prefixes these names with the project — `<project>_mail-data` and
# `<project>_oauth-data`, the project being this directory's name unless you set
# one. `docker volume ls` shows what yours are called.
#
# They are not less inspectable than a directory, only inspected differently:
#
#   docker compose exec mail-mcp   ls -ln /data     # what is in there
#   docker compose exec mail-oauth cat  /data/operator.json
#
# and docs/DEPLOYMENT.md step 3 has the backup, restore and hand-edit recipes,
# plus the migration for an install that already has ./data and ./oauth-data.
# Nothing there is lost: the migration copies both directories in and keeps them
# until you have confirmed the stack came back up on their contents.
#
# Swap either line back to a bind mount if you would rather have the files under
# the checkout — `- ./data:/data` — but then create the directory and give it to
# the right uid *before* the first start, or you are back at #105. Both services
# now say so at boot, naming the exact mkdir and chown, instead of failing on the
# first write.
volumes:
  mail-data:
  oauth-data:

# ---------------------------------------------------------------------------
# ./secrets — files, not environment variables. Values set through `env_file`
# are visible in `docker inspect` and to anything that can read the container's
# environment; these are not.
#
# Two directories, split by *audience* rather than by kind, because each service
# is mounted only the one it has business with:
#
#   secrets/shared/           mounted into both services
#     auth_token.txt          the connector's static token, which mail-oauth
#                             substitutes into every proxied request and never
#                             sends to a client. Read by both.
#     settings_signing_key.txt
#                             lets the connector trust a /settings/mailboxes
#                             request as genuinely having come through the OAuth
#                             layer's session and CSRF checks, rather than
#                             directly from the network. Read by both.
#
#   secrets/oauth/            mounted into mail-oauth only
#     oauth_signing_key.txt   signs access and refresh tokens.
#     auth_password_hash.txt  scrypt hash of the operator's password:
#                               read -rs PW && printf '%s\n' "$PW" | \
#                                 docker compose run --rm -T --entrypoint node \
#                                 mail-oauth dist/hash-password.js \
#                                 > secrets/oauth/auth_password_hash.txt; unset PW
#                             The --entrypoint override is required: the image's
#                             ENTRYPOINT is `node dist/index.js`, so a trailing
#                             command is appended to it as arguments and starts
#                             the server instead of the hashing tool. You can
#                             skip this file entirely and let the setup wizard
#                             write the operator record instead.
#
# Until #77 this was one flat ./secrets mounted read-write into both services,
# so the connector — the process that parses attacker-supplied MIME off the
# public internet — could read the OAuth signing key (forge an access token for
# /mcp) and the operator's password hash (crack it offline, then own /authorize
# and /settings). Its environment named neither; the mount handed it both. Two
# directories and two mounts is what takes that back, and it costs an operator
# one extra `mkdir`. See docs/DEPLOYMENT.md step 2 for the migration from a flat
# directory — the four files move, nothing is regenerated, no token changes.
#
# Both mounts stay writable. The connector's, because it usually boots first
# (mail-oauth `depends_on` it) and is therefore the service that generates the
# two shared secrets on a first boot, and because replacing a file somebody
# truncated to nothing means unlinking it first. The OAuth layer's, because it
# generates its signing key the same way and writes there for the same reasons.
#
# The three random secrets generate themselves. Whichever service boots first
# writes the file, mode 640, and the other reads it; a file that is already there
# is always used as it stands, so an upgrade never rotates a token out from under
# a connected client. auth_password_hash.txt is the one that is never generated —
# it is the one value with a meaning outside this deployment.
#
# Bind mounts rather than the `secrets:` block this file used to carry, because
# Docker refuses to start a stack whose file-secret does not exist yet, which is
# precisely the state a first boot is in.
#
# Both containers create files under secrets/ and they run as different uids —
# 100 for the connector, 102 for the OAuth layer — so they need one group in
# common. Create it on the host, give both directories to it setgid so files
# created inside inherit it, and tell Compose its gid:
#
#   sudo groupadd --system mailsecrets
#   mkdir -p secrets/shared secrets/oauth
#   sudo chgrp mailsecrets secrets/shared secrets/oauth
#   sudo chmod 2770 secrets/shared secrets/oauth
#   echo "SECRETS_GID=$(getent group mailsecrets | cut -d: -f3)" >> .env
#
# secrets/ itself stays an ordinary directory owned by whoever made it; nothing
# is mounted from it and no container ever traverses it. Do create both
# subdirectories before the first `docker compose up`: Docker creates a missing
# bind-mount source itself, as root, mode 755 and without the setgid bit, and
# both services then fail to create anything in it.
#
# The `group_add` on both services above is what puts the container processes in
# that group. Earlier versions of this file pinned the group at gid 105 in both
# images and told you to `chgrp 105 secrets`; that number was verified free
# inside node:24-alpine, but the chgrp runs on the *host*, where 100–999 is the
# system range and 105 usually already belongs to a real system group. Where it
# did, the instruction handed that group a writable secrets directory. Nothing in
# either image pins a gid any more — the group is yours and its number is
# whatever your host assigned.
#
# The setgid bit is not decoration: without it the connector's file lands in gid
# 101 at mode 640 and the OAuth layer cannot read it. `2770` also means no
# account outside that group can write here — which matters, because this file's
# precedence rule is "a present file wins", so anyone able to drop an
# auth_token.txt into secrets/shared before the first boot would own the
# instance. That is exactly why the group has to be one you created for it and
# not a system group that came with the distribution. See docs/DEPLOYMENT.md.
#
# One group for both directories, not two. secrets/oauth is kept away from the
# connector by the mount — that container has no path to the directory at all,
# whatever group it is in — and a second gid would be a second thing for an
# operator to get wrong for no gain. What the shared group still means is that a
# compromised connector can rewrite the two secrets in secrets/shared. Those are
# its own credentials, and it has to be able to create them on a first boot
# anyway; neither of the OAuth layer's two is reachable from it.
#
# You can still pre-create the four files by hand instead — nothing is generated
# over a file that already exists, and the connector's mount can then be made
# read-only (`:ro`). The OAuth layer's cannot: it rewrites a blank secret file in
# place, and #58's "no hash" / "hash unreadable" distinction depends on it.
# ---------------------------------------------------------------------------
